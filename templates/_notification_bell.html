{% if current_user %}<a class="notification-bell" href="/notifications" aria-label="Notifications" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>{% if notification_count %}<span class="notification-badge{% if notification_count > 5 %} dot{% endif %}">{% if notification_count <= 5 %}{{notification_count}}{% endif %}</span>{% endif %}</a>{% endif %}
{% if current_user %}<script>(function(){if(window.__primeNotificationSound)return;window.__primeNotificationSound=true;var last=null,armed=false;function beep(){if(!armed || localStorage.getItem('prime_notification_sound_enabled')==='0')return;try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var c=new A(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=740;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.045,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.22);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.23)}catch(e){}}window.addEventListener('click',()=>armed=true,{passive:true});window.addEventListener('keydown',()=>armed=true,{passive:true});function poll(){fetch('/api/notifications',{cache:'no-store'}).then(r=>r.json()).then(d=>{var n=Number(d.count||0);if(last!==null&&n>last)beep();last=n}).catch(()=>{})}poll();setInterval(poll,12000)})();</script>{% endif %}
