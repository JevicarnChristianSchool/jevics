<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{settings.school_name}} | AI Assistant</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><link rel="stylesheet" media="(min-width: 821px)" href="{{url_for('static',filename='css/desktop.css')}}"><link rel="stylesheet" media="(max-width: 820px)" href="{{url_for('static',filename='css/mobile.css')}}"><style>{{theme_style|safe}}{{theme_preset_style|safe}} .ai-answer{white-space:pre-wrap;line-height:1.7}.ai-shell{max-width:920px;margin:0 auto;width:100%}</style></head><body class="app-body sidebar-style-{{ school_settings.sidebar_style|default("drawer", true) }}">{% include "_notification_bell.html" %}<aside class="sidebar glass"><div><div class="brand-line"><span class="brand-dot"></span><div><div class="brand-name">{{settings.school_name}}</div><div class="brand-subtitle">AI Assistant</div></div></div><nav class="side-nav"><a class="nav-link" href="/dashboard">Portal</a><a class="nav-link" href="/system-help">System Help</a></nav></div><a class="btn btn-ghost btn-block" href="/logout">Logout</a></aside><main class="content"><div class="ai-shell"><header class="topbar glass"><div><div class="eyebrow">Institution AI</div><h1>AI Assistant</h1><div class="topbar-subtitle">Configured by your Administrator · {{settings.ai_model or 'Not configured'}}</div></div></header><section class="panel glass"><div class="eyebrow">Ask</div><h3>What do you need?</h3><form id="aiForm" class="stack-form"><textarea id="aiPrompt" rows="6" placeholder="Explain a topic, create revision questions, help with a document, or ask a system-use question..."></textarea><button class="btn btn-primary" type="submit">Ask AI</button></form></section><section id="aiResult" class="panel glass hidden"><div class="eyebrow">Response</div><div id="aiText" class="ai-answer"></div></section></div><script>document.getElementById('aiForm').addEventListener('submit',async e=>{e.preventDefault();const prompt=document.getElementById('aiPrompt').value.trim();if(!prompt)return;const box=document.getElementById('aiResult'),out=document.getElementById('aiText');box.classList.remove('hidden');out.textContent='Thinking…';try{const r=await fetch('/ai/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const d=await r.json();out.textContent=d.answer||d.error||'No response.'}catch(err){out.textContent='AI request failed: '+err}});</script></main>{% include '_footer.html' %}</body></html>
