<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{settings.school_name}} | Review</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><style>
.review-shell{max-width:820px;margin:0 auto}.review-card{padding:clamp(24px,5vw,56px);text-align:center;min-height:360px;display:grid;align-content:center;gap:18px}.review-front{font-size:clamp(26px,4vw,42px);font-weight:850;line-height:1.12}.review-back{font-size:20px;color:var(--muted-text);line-height:1.55}.rating-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:560px){.rating-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body class="app-body"><main class="content review-shell"><header class="topbar glass"><div><div class="eyebrow">{{deck.subject}}{% if deck.class_name %} · {{deck.class_name}}{% endif %}</div><h1>{{deck.title}}</h1><div class="topbar-subtitle">Card {{index+1}} of {{total}}</div></div><a class="btn btn-ghost" href="{{url_for('flashcards_workspace',deck_id=deck.id)}}">Exit review</a></header><section class="panel glass review-card"><div class="review-front">{{card.front}}</div>{% if card.hint %}<div class="muted">Hint: {{card.hint}}</div>{% endif %}<details><summary class="btn btn-ghost" style="display:inline-flex;cursor:pointer">Reveal answer</summary><div class="review-back" style="margin-top:18px">{{card.back}}</div></details><form method="post" class="rating-grid"><input type="hidden" name="index" value="{{index}}"><button class="btn btn-danger" name="rating" value="0">Need review</button><button class="btn btn-ghost" name="rating" value="1">Hard</button><button class="btn btn-ghost" name="rating" value="2">Good</button><button class="btn btn-primary" name="rating" value="3">Easy</button></form></section></main></body></html>
