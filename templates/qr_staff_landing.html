<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff QR | {{user_name}}</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><link rel="stylesheet" media="(min-width: 821px)" href="{{url_for('static',filename='css/desktop.css')}}"><link rel="stylesheet" media="(max-width: 820px)" href="{{url_for('static',filename='css/mobile.css')}}"><style>body{display:grid;place-items:center;min-height:100vh}.qr-login-card{width:min(560px,92vw);padding:28px;text-align:center}.qr-check{font-size:54px;margin-bottom:8px}.status{margin-top:16px;font-weight:700}.muted{line-height:1.55}</style></head><body class="app-body"><section class="panel glass qr-login-card"><div class="qr-check">✓</div><div class="eyebrow">Staff QR access</div><h1 style="margin:8px 0">Welcome, {{user_name}}</h1><p class="muted" id="message">Preparing secure sign-in and attendance…</p><div class="mini-card"><strong id="attendanceMode">Next attendance: {{'Check out' if next_action=='OUT' else 'Check in'}}</strong><span class="muted">Your QR acts as both your staff sign-in and attendance action.</span></div><p class="muted small" id="locationState" style="margin-top:12px">Location: requesting when available…</p><a class="btn btn-primary btn-block" id="continueBtn" href="{{dashboard_url}}" style="display:none;margin-top:14px">Continue to my dashboard</a></section>
<script>
const token={{token|tojson}},dashboard={{dashboard_url|tojson}},suggested={{next_action|tojson}};
const queueKey='staff-qr-attendance:'+token;
let coords={latitude:null,longitude:null,accuracy:null,label:''};
function locationText(t){document.getElementById('locationState').textContent='Location: '+t}
async function getLocation(){if(!navigator.geolocation){locationText('not available in this browser');return}return new Promise(resolve=>navigator.geolocation.getCurrentPosition(async p=>{coords={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,label:''};locationText('captured · ±'+Math.round(p.coords.accuracy||0)+' m');try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+encodeURIComponent(coords.latitude)+'&lon='+encodeURIComponent(coords.longitude),{headers:{'Accept-Language':'en'}});const j=r.ok?await r.json():null;if(j?.display_name){coords.label=j.display_name;locationText(j.display_name+' · ±'+Math.round(p.coords.accuracy||0)+' m')}}catch(_){}resolve()},()=>{locationText('not captured (attendance can still continue)');resolve()},{enableHighAccuracy:true,timeout:9000,maximumAge:0}))}
async function syncOffline(){if(!navigator.onLine)return;const events=JSON.parse(localStorage.getItem(queueKey)||'[]');if(!events.length)return;try{const r=await fetch('/qr/offline-sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,events})});const j=await r.json();if(j.ok)localStorage.removeItem(queueKey)}catch(_){} }
async function consume(){
  const eventAt=new Date().toISOString();
  const item={action:suggested,event_at:eventAt,latitude:coords.latitude,longitude:coords.longitude,accuracy:coords.accuracy,location_label:coords.label,device_note:'staff-qr'};
  if(!navigator.onLine){const q=JSON.parse(localStorage.getItem(queueKey)||'[]');q.push(item);localStorage.setItem(queueKey,JSON.stringify(q.slice(-20)));document.getElementById('message').textContent='You are offline. Your attendance is safely queued on this device. Opening your staff dashboard…';document.getElementById('continueBtn').style.display='block';document.getElementById('continueBtn').href=dashboard;window.setTimeout(()=>{window.location.href='/qr/'+encodeURIComponent(token)+'/offline-dashboard'},900);return;}
  try{const r=await fetch('/qr/'+encodeURIComponent(token)+'/consume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});const j=await r.json();if(j.ok){document.getElementById('message').textContent=j.message+' Opening your dashboard…';document.getElementById('continueBtn').style.display='block';document.getElementById('continueBtn').href=j.dashboard||dashboard;window.setTimeout(()=>{window.location.href=j.dashboard||dashboard},700);return}document.getElementById('message').textContent=j.message||'QR sign-in could not be completed.';}catch(_){const q=JSON.parse(localStorage.getItem(queueKey)||'[]');q.push(item);localStorage.setItem(queueKey,JSON.stringify(q.slice(-20)));document.getElementById('message').textContent='Connection dropped. Attendance queued offline; opening your dashboard…';document.getElementById('continueBtn').style.display='block';window.setTimeout(()=>{window.location.href='/qr/'+encodeURIComponent(token)+'/offline-dashboard'},900)}
}
window.addEventListener('online',syncOffline);(async()=>{await getLocation();await syncOffline();await consume()})();
</script></body></html>
