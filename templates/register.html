<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ portal_title }} | Administrator setup</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" media="(min-width: 821px)" href="{{url_for('static',filename='css/desktop.css')}}"><link rel="stylesheet" media="(max-width: 820px)" href="{{url_for('static',filename='css/mobile.css')}}"><style>{{theme_style|safe}}{{theme_preset_style|safe}}</style></head>
<body class="auth-body" style="--primary-blue: {{ school_settings.primary_color }};--deep-accent-blue:{{ school_settings.accent_color }};--bg:{{ school_settings.background_color }};--panel:{{ school_settings.panel_color }}"><main class="auth-shell"><section class="auth-card glass"><div class="brand-line"><span class="brand-dot"></span><div><div class="brand-name">{{ portal_title }}</div><div class="brand-subtitle">Administrator setup</div></div></div><div class="eyebrow">First installation</div><h1>Register Administrator</h1><p class="muted">This page is available only until the first Administrator account is created.</p><form method="post" class="stack-form"><label><span>Full name</span><input name="full_name" required></label><label><span>Username</span><input name="username" autocomplete="username" required></label><label><span>Password</span><div class="password-wrap"><input id="regPassword" type="password" name="password" autocomplete="new-password" minlength="4" required><button class="password-toggle" type="button" data-password-target="regPassword">Show</button></div></label><label><span>Confirm password</span><div class="password-wrap"><input id="regConfirm" type="password" name="confirm_password" autocomplete="new-password" minlength="4" required><button class="password-toggle" type="button" data-password-target="regConfirm">Show</button></div></label><button class="btn btn-primary" type="submit">Create Administrator</button></form></section></main><script>document.addEventListener('click',function(e){const b=e.target.closest('.password-toggle');if(!b)return;const i=document.getElementById(b.dataset.passwordTarget);if(!i)return;i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide';});</script><footer class="portal-watermark">© 2026 Toror Technology and Innovations Ltd. All rights reserved.</footer></body></html>
